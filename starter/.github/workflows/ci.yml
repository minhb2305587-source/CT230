name: ci
# Pipeline tối thiểu cho bài thực hành: mọi push/PR phải chạy xanh ./mvnw -B verify
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # TODO(TH2-8): đẩy nhánh lên GitHub, mở PR và xác nhận job này xanh (runner ubuntu-latest có sẵn Docker cho Testcontainers)
      - name: Build và kiểm thử (gồm Testcontainers nếu có)
        run: |
          chmod +x mvnw
          ./mvnw -B verify
